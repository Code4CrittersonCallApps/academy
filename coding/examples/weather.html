<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Outdoor event go/no-go · Code to Ship example</title>
<style>
body{font-family:system-ui,Arial,sans-serif;background:#eef4f8;color:#1b2a36;margin:0;padding:16px}
.wrap{max-width:560px;margin:auto}a{color:#1f6fb2}
.day{background:#fff;border-radius:12px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;gap:10px;align-items:center;box-shadow:0 2px 10px #0001}
.go{font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap}
.yes{background:#d6f5df;color:#17602d}.no{background:#fde1e1;color:#9b1c1c}.maybe{background:#fff2c9;color:#7a5a00}
small{color:#5a6b78}
</style></head><body><div class="wrap">
<a href="../#m10">← Back to Module 10</a>
<h1>Outdoor event go/no-go</h1>
<p><small>Live 7-day forecast for Callahan, FL from the free Open-Meteo API (no key). Rules: rain chance over 50% or heat over 95°F = move indoors or tent.</small></p>
<div id="out">Loading forecast…</div>
</div>
<script>
// Change these for your town and your rules.
const LAT = 30.56, LON = -81.83, MAX_RAIN = 50, MAX_HEAT = 95;
const url = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON +
  "&daily=temperature_2m_max,precipitation_probability_max&temperature_unit=fahrenheit&timezone=America%2FNew_York";

async function run(){
  const out = document.getElementById("out");
  try {
    const r = await fetch(url);                 // 1) ask the API
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = (await r.json()).daily;            // 2) turn the JSON answer into an object
    out.textContent = "";
    d.time.forEach((day, i) => {                 // 3) one row per day
      const hi = Math.round(d.temperature_2m_max[i]), rain = d.precipitation_probability_max[i] ?? 0;
      let cls = "yes", label = "Go outdoors";
      if (rain > MAX_RAIN || hi > MAX_HEAT) { cls = "no"; label = "Plan B"; }
      else if (rain > MAX_RAIN - 20) { cls = "maybe"; label = "Bring the tent"; }
      const row = document.createElement("div"); row.className = "day";
      const when = new Date(day + "T12:00").toLocaleDateString("en-US", {weekday:"short", month:"short", day:"numeric"});
      row.innerHTML = "<div><b></b><br><small></small></div><span class='go " + cls + "'></span>";
      row.querySelector("b").textContent = when;
      row.querySelector("small").textContent = hi + "°F high · " + rain + "% rain";
      row.querySelector(".go").textContent = label;
      out.appendChild(row);
    });
  } catch (e) {
    out.textContent = "Could not load the forecast right now (" + e.message + "). Try again in a minute.";
  }
}
run();
</script></body></html>
