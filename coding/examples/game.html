<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Catch the Chicken · Code to Ship example</title>
<style>
body{margin:0;font-family:system-ui,Arial,sans-serif;background:#a8d672;color:#173;text-align:center;user-select:none}
.bar{display:flex;justify-content:space-between;padding:10px 14px;font-weight:800;font-size:18px;background:#7fb94a;color:#fff}
.bar a{color:#fff}
canvas{display:block;width:100%;height:calc(100vh - 100px);touch-action:none}
#start{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:20px;font-weight:800;padding:14px 26px;border-radius:14px;border:0;background:#f0b90b}
</style></head><body>
<div class="bar"><a href="../#m8">← Module 8</a><span id="score">Score 0</span><span id="time">30s</span><span id="best">Best 0</span></div>
<canvas id="c"></canvas>
<button id="start">Tap to start: catch the chicken!</button>
<script>
const c = document.getElementById("c"), ctx = c.getContext("2d");
let W, H, chick, score = 0, timeLeft = 30, running = false, last = 0, pops = [];
let best = 0; try { best = Number(localStorage.getItem("chicken-best")) || 0; } catch(e) {}
document.getElementById("best").textContent = "Best " + best;

function resize(){ W = c.width = c.clientWidth; H = c.height = c.clientHeight; }
window.addEventListener("resize", resize); resize();

function newChicken(){
  const speed = 120 + score * 12;                 // gets harder as you score
  const a = Math.random() * Math.PI * 2;
  chick = { x: Math.random()*(W-80)+40, y: Math.random()*(H-80)+40, vx: Math.cos(a)*speed, vy: Math.sin(a)*speed, r: 34 };
}

// UPDATE: move things, bounce off edges, count down the clock
function update(dt){
  chick.x += chick.vx*dt; chick.y += chick.vy*dt;
  if (chick.x < chick.r || chick.x > W-chick.r) chick.vx *= -1;
  if (chick.y < chick.r || chick.y > H-chick.r) chick.vy *= -1;
  chick.x = Math.max(chick.r, Math.min(W-chick.r, chick.x)); chick.y = Math.max(chick.r, Math.min(H-chick.r, chick.y));
  timeLeft -= dt; pops = pops.filter(p => (p.t -= dt) > 0);
  if (timeLeft <= 0) end();
}
// DRAW: repaint everything each frame
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.font = "56px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(chick.vx < 0 ? "🐔" : "🐓", chick.x, chick.y);
  ctx.font = "bold 26px system-ui"; ctx.fillStyle = "#fff";
  pops.forEach(p => ctx.fillText("+1", p.x, p.y - (0.6-p.t)*60));
  document.getElementById("score").textContent = "Score " + score;
  document.getElementById("time").textContent = Math.ceil(Math.max(0,timeLeft)) + "s";
}
function loop(t){
  const dt = Math.min(0.05, (t - last)/1000); last = t;
  if (!running) return;
  update(dt); draw();
  if (running) requestAnimationFrame(loop);
}
// INPUT: a tap within the chicken's radius scores
c.addEventListener("pointerdown", e => {
  if (!running) return;
  const r = c.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  if (Math.hypot(x - chick.x, y - chick.y) < chick.r + 14) { score++; pops.push({x:chick.x, y:chick.y, t:0.6}); newChicken(); }
});
function end(){
  running = false;
  if (score > best) { best = score; try { localStorage.setItem("chicken-best", best); } catch(e) {} }
  document.getElementById("best").textContent = "Best " + best;
  const b = document.getElementById("start"); b.textContent = "You caught " + score + "! Play again"; b.style.display = "block";
}
document.getElementById("start").addEventListener("click", () => {
  score = 0; timeLeft = 30; running = true; newChicken();
  document.getElementById("start").style.display = "none";
  last = performance.now(); requestAnimationFrame(loop);
});
</script></body></html>
